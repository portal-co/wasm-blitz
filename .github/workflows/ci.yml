name: ci

# Baseline CI: build workspace + unit tests (fast gate, no suite checkout).

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install LLVM/clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"

      - name: Build workspace
        run: cargo build --workspace

      - name: Run e2e tests
        run: cargo test -p portal-solutions-blitz-tests --test e2e
