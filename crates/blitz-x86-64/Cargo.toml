[package]
name = "portal-solutions-blitz-x86-64"
version = "0.1.0"
edition = "2024"
license.workspace = true
description.workspace = true

[dev-dependencies]
# Enable the `iced` binary emitter for unit tests that assemble real bytes.
portal-solutions-asm-x86-64 = { workspace = true, features = ["regalloc-integration", "iced"] }

[dependencies]
portal-solutions-blitz-codegen.workspace = true
portal-solutions-asm-x86-64 = { workspace = true, features = ["regalloc-integration"] }
portal-solutions-asm-regalloc.workspace = true
portal-solutions-blitz-common = { workspace = true, features = ["asm"] }
typeid.workspace = true
wax-core.workspace = true
wasm-encoder.workspace = true
wasmparser.workspace = true
