[package]
name = "portal-solutions-blitz-aarch64"
version = "0.1.0"
edition = "2024"
license.workspace = true
description.workspace = true

[dev-dependencies]
# Enable the binary emitter for unit tests that assemble real bytes.
portal-solutions-asm-aarch64 = { workspace = true, features = ["bin-backend"] }

[dependencies]
portal-solutions-blitz-codegen.workspace = true
portal-solutions-blitz-common = { workspace = true, features = ["asm"] }
portal-solutions-asm-aarch64 = { workspace = true, features = ["regalloc-integration"] }
portal-solutions-asm-regalloc.workspace = true
portal-pc-asm-common = { workspace = true }
portal-solutions-blitz-i4.workspace = true
wax-core.workspace = true
wasm-encoder.workspace = true
wasmparser.workspace = true
